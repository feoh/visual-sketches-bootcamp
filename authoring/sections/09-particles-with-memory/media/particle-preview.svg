<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
<title id="title">Particles with bounded history trails</title><desc id="desc">On a cream field, teal circles and coral squares follow two curved, bounded oldest-to-newest trails from small earlier marks to large current heads. Both trajectories stay inside the rounded viewport boundary, and shape plus size distinguish the palette roles without color alone.</desc>
<rect width="720" height="320" rx="18" fill="#f6f1e1"/>
<g fill="none" stroke-linecap="round"><path d="M90 235 Q210 38 342 142 T628 230" stroke="#17697a" stroke-width="4" stroke-dasharray="2 13"/><path d="M104 92 Q250 220 418 101 T652 75" stroke="#cf4840" stroke-width="3" stroke-dasharray="2 11"/></g>
<g fill="#17697a"><circle cx="90" cy="235" r="3"/><circle cx="155" cy="130" r="4"/><circle cx="244" cy="91" r="5"/><circle cx="342" cy="142" r="7"/><circle cx="628" cy="230" r="10"/></g>
<g fill="#cf4840"><rect x="101" y="89" width="6" height="6"/><rect x="225" y="147" width="8" height="8"/><rect x="414" y="97" width="10" height="10"/><rect x="646" y="69" width="13" height="13"/></g>
</svg>
