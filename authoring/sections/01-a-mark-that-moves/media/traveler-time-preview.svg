<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">A traveler advances through three time partitions</title>
<desc id="desc">Three equally sized dark panels show a yellow circular mark at local ruler positions 70, 100, and 130 pixels: start, after 30 fixed steps, and after 60 fixed steps at 120 pixels per second. A cyan trail extends left from each mark. Identical white rulers make the equal advances comparable.</desc>
<rect width="900" height="260" fill="#f6f1e7"/>
<g font-family="sans-serif" font-size="18" fill="#172742">
<text x="45" y="32">start</text><text x="345" y="32">30 × 1/120 s</text><text x="645" y="32">60 × 1/120 s</text>
</g>
<g fill="#1c182e"><rect x="30" y="50" width="240" height="160" rx="8"/><rect x="330" y="50" width="240" height="160" rx="8"/><rect x="630" y="50" width="240" height="160" rx="8"/></g>
<g stroke="#57c4e5" stroke-width="7"><line x1="70" y1="130" x2="100" y2="130"/><line x1="390" y1="130" x2="430" y2="130"/><line x1="710" y1="130" x2="760" y2="130"/></g>
<g fill="#fcd34d"><circle cx="100" cy="130" r="16"/><circle cx="430" cy="130" r="16"/><circle cx="760" cy="130" r="16"/></g>
<g stroke="#fff" stroke-width="2">
<path d="M100 175v12m30-12v12m30-12v12"/>
<path d="M400 175v12m30-12v12m30-12v12"/>
<path d="M700 175v12m30-12v12m30-12v12"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">
<text x="100" y="203">70</text><text x="130" y="203">100</text><text x="160" y="203">130</text>
<text x="400" y="203">70</text><text x="430" y="203">100</text><text x="460" y="203">130</text>
<text x="700" y="203">70</text><text x="730" y="203">100</text><text x="760" y="203">130</text>
</g>
<text x="450" y="242" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172742">At 120 pixels/second, each 30-step interval advances the mark by 30 pixels.</text>
</svg>
