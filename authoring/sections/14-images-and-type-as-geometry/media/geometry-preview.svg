<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Mask transformed into animated geometry</title><desc id="desc">Three panels show a grayscale SHAPE mask, threshold-sampled navy circles with a centroid crosshair, and amber tangent-like bars displaced around the same centroid. Labeled arrows show threshold sampling then transformation.</desc>
<rect width="960" height="360" fill="#f4efde"/><g font-family="sans-serif" fill="#27313a"><text x="35" y="38" font-size="20">1  MASK</text><text x="355" y="38" font-size="20">2  SAMPLES + CENTROID</text><text x="700" y="38" font-size="20">3  ANIMATED MARKS</text></g>
<rect x="35" y="70" width="245" height="210" rx="8" fill="#fff" stroke="#59636b" stroke-width="3"/><text x="53" y="195" font-family="monospace" font-weight="bold" font-size="62" fill="#1d2730">SHAPE</text>
<path d="M287 175h52m-12-10 12 10-12 10" fill="none" stroke="#59636b" stroke-width="3"/><text x="285" y="152" font-family="sans-serif" font-size="15" fill="#27313a">threshold</text>
<rect x="355" y="70" width="270" height="210" rx="8" fill="#fff" stroke="#59636b" stroke-width="3"/><g fill="#1c5b73">
<circle cx="380" cy="125" r="5"/><circle cx="405" cy="125" r="5"/><circle cx="430" cy="125" r="5"/><circle cx="380" cy="150" r="5"/><circle cx="380" cy="175" r="5"/><circle cx="405" cy="175" r="5"/><circle cx="430" cy="175" r="5"/><circle cx="455" cy="125" r="5"/><circle cx="455" cy="150" r="5"/><circle cx="455" cy="175" r="5"/><circle cx="480" cy="150" r="5"/><circle cx="505" cy="125" r="5"/><circle cx="505" cy="150" r="5"/><circle cx="505" cy="175" r="5"/><circle cx="530" cy="125" r="5"/><circle cx="530" cy="175" r="5"/><circle cx="555" cy="125" r="5"/><circle cx="555" cy="150" r="5"/><circle cx="555" cy="175" r="5"/><circle cx="580" cy="125" r="5"/><circle cx="580" cy="175" r="5"/></g><g stroke="#27313a" stroke-width="3"><path d="M487 202v28M473 216h28"/></g><text x="452" y="252" font-family="sans-serif" font-size="14" fill="#27313a">centroid</text>
<path d="M632 175h52m-12-10 12 10-12 10" fill="none" stroke="#59636b" stroke-width="3"/><text x="637" y="152" font-family="sans-serif" font-size="15" fill="#27313a">transform</text>
<rect x="700" y="70" width="225" height="210" rx="8" fill="#17202e" stroke="#59636b" stroke-width="3"/><g stroke="#f0ad49" stroke-width="6" stroke-linecap="round"><path d="M730 145l25-16M760 118l30-5M800 115l28 10M835 135l20 23M858 170l-2 28M848 210l-22 18M810 237l-28 2M770 232l-24-18M738 203l-10-26"/></g><g stroke="#fff" stroke-width="2"><path d="M810 168v28M796 182h28"/></g>
<g font-family="sans-serif" fill="#27313a" font-size="16"><text x="35" y="320">Dark rectangle pixels are data.</text><text x="355" y="320">Circles show selected coordinates.</text><text x="700" y="320">Bars show motion and tangent direction.</text></g></svg>
