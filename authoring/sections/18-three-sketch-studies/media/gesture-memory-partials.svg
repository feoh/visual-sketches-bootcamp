<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Two partial gesture-memory grammars</title>
  <desc id="desc">Left, an unfinished curving gesture is replaced by spaced perpendicular contour ribs with age shown by length. Right, square stamps shrink through four labeled age columns, breaking path continuity.</desc>
  <rect width="960" height="360" fill="#f6f1e8"/>
  <rect x="24" y="24" width="438" height="312" rx="12" fill="#fffdf8" stroke="#242321" stroke-width="2"/>
  <rect x="498" y="24" width="438" height="312" rx="12" fill="#fffdf8" stroke="#242321" stroke-width="2"/>
  <text x="48" y="58" font-family="sans-serif" font-size="18" font-weight="700" fill="#242321">PARTIAL A · CONTOUR RIBS</text>
  <path d="M75 250 C135 80 255 290 405 105" fill="none" stroke="#8a857d" stroke-width="2" stroke-dasharray="6 7"/>
  <g stroke="#242321" stroke-width="7" stroke-linecap="square">
    <path d="M83 245l-24-10"/><path d="M107 180l-32-4"/><path d="M145 142l-36 18"/>
    <path d="M190 155l-26 34"/><path d="M236 198l-8 40"/><path d="M284 215l15 35"/>
    <path d="M331 187l28 20"/><path d="M371 139l30 8"/><path d="M402 105l25-10"/>
  </g>
  <text x="62" y="310" font-family="sans-serif" font-size="14" fill="#4e4a45">older · short</text>
  <text x="353" y="310" font-family="sans-serif" font-size="14" fill="#4e4a45">newer · long</text>
  <text x="522" y="58" font-family="sans-serif" font-size="18" font-weight="700" fill="#242321">PARTIAL B · AGE ARCHIVE</text>
  <g stroke="#242321" fill="none">
    <path d="M548 82v210M642 82v210M736 82v210M830 82v210" stroke="#aaa39a" stroke-dasharray="4 7"/>
    <rect x="531" y="112" width="34" height="34" stroke-width="6"/><rect x="535" y="194" width="26" height="26" stroke-width="5"/>
    <rect x="629" y="92" width="26" height="26" stroke-width="5"/><rect x="632" y="170" width="20" height="20" stroke-width="4"/><rect x="634" y="244" width="16" height="16" stroke-width="4"/>
    <rect x="727" y="126" width="18" height="18" stroke-width="4"/><rect x="729" y="218" width="14" height="14" stroke-width="3"/>
    <rect x="824" y="102" width="12" height="12" stroke-width="3"/><rect x="826" y="185" width="9" height="9" stroke-width="3"/>
  </g>
  <text x="525" y="316" font-family="sans-serif" font-size="14" fill="#4e4a45">NEW</text><text x="812" y="316" font-family="sans-serif" font-size="14" fill="#4e4a45">OLD</text>
</svg>
