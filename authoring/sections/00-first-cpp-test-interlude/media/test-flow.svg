<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Arrange, act, assert test flow</title>
  <desc id="desc">Three bordered boxes flow left to right. Arrange fixes seed 17 and viewport 640 by 480. Act calls makeModel. Assert compares x position 0.6848907471 with tolerance.</desc>
  <rect width="800" height="260" fill="#fff8e8"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#17223b">
    <rect x="35" y="65" width="205" height="130" rx="12" fill="#d9edf7" stroke="#17223b" stroke-width="4"/>
    <text x="137" y="105" font-size="25" font-weight="bold">Arrange</text>
    <text x="137" y="140" font-size="18">seed = 17</text><text x="137" y="168" font-size="18">640 × 480</text>
    <path d="M250 130h55" stroke="#17223b" stroke-width="5"/><path d="m305 130-16-11v22z" fill="#17223b"/>
    <rect x="315" y="65" width="170" height="130" rx="12" fill="#f8d7a3" stroke="#17223b" stroke-width="4"/>
    <text x="400" y="105" font-size="25" font-weight="bold">Act</text>
    <text x="400" y="146" font-size="18">makeModel(...)</text>
    <path d="M495 130h55" stroke="#17223b" stroke-width="5"/><path d="m550 130-16-11v22z" fill="#17223b"/>
    <rect x="560" y="65" width="205" height="130" rx="12" fill="#d8efd2" stroke="#17223b" stroke-width="4"/>
    <text x="662" y="105" font-size="25" font-weight="bold">Assert</text>
    <text x="662" y="140" font-size="17">x ≈ 0.6848907471</text><text x="662" y="168" font-size="17">abs tol = 0.00001</text>
  </g>
</svg>
