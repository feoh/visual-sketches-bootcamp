<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic replay boundary</title>
  <desc id="desc">Live controls and a recorded fixture converge on one normalized input adapter. The adapter feeds a fixed-step deterministic model, inspectable geometry, and finally a renderer. A reset arrow returns both adapter and model to seed, cursor, accumulator, and initial state.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#23333d"/></marker></defs>
  <rect width="1080" height="360" fill="#edf3f6"/>
  <text x="38" y="46" font-family="sans-serif" font-size="22" font-weight="700" fill="#23333d">ONE PATH FOR LIVE AND RECORDED BEHAVIOR</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#23333d">
    <rect x="38" y="78" width="180" height="66" rx="10" fill="#fff" stroke="#23333d" stroke-width="2"/><text x="128" y="106" font-size="16" font-weight="700">LIVE CONTROLS</text><text x="128" y="129" font-size="13">pixels · keys · device scalar</text>
    <rect x="38" y="176" width="180" height="66" rx="10" fill="#fff" stroke="#23333d" stroke-width="2"/><text x="128" y="204" font-size="16" font-weight="700">RECORDED FIXTURE</text><text x="128" y="227" font-size="13">ticks · viewport · events</text>
    <rect x="278" y="117" width="190" height="88" rx="10" fill="#fff" stroke="#286c73" stroke-width="4"/><text x="373" y="149" font-size="16" font-weight="700">INPUT ADAPTER</text><text x="373" y="174" font-size="13">normalize · validate · order</text><text x="373" y="194" font-size="12">visible rejection status</text>
    <rect x="526" y="117" width="190" height="88" rx="10" fill="#fff" stroke="#286c73" stroke-width="4"/><text x="621" y="149" font-size="16" font-weight="700">FIXED-STEP MODEL</text><text x="621" y="174" font-size="13">seed · explicit dt · caps</text><text x="621" y="194" font-size="12">no window, clock, or device</text>
    <rect x="774" y="117" width="150" height="88" rx="10" fill="#fff" stroke="#23333d" stroke-width="2"/><text x="849" y="149" font-size="16" font-weight="700">GEOMETRY</text><text x="849" y="174" font-size="13">inspect first</text><text x="849" y="194" font-size="12">finite snapshot</text>
    <rect x="972" y="117" width="80" height="88" rx="10" fill="#fff" stroke="#23333d" stroke-width="2"/><text x="1012" y="151" font-size="14" font-weight="700">DRAW</text><text x="1012" y="177" font-size="12">adapter</text>
    <path d="M218 111h54M218 209h30q24 0 24-24M468 161h52M716 161h52M924 161h42" fill="none" stroke="#23333d" stroke-width="3" marker-end="url(#a)"/>
    <path d="M621 212v71H373v-71" fill="none" stroke="#b24e41" stroke-width="4" marker-end="url(#a)"/>
    <text x="497" y="307" font-size="14" font-weight="700">RESET: seed + replay cursor + accumulator + model + queued input</text>
    <text x="540" y="340" font-size="13">renderer output is reviewed manually; deterministic checkpoints stop at state and geometry</text>
  </g>
</svg>
