  <title id="title">Partial calligraphic flow process</title>
  <desc id="desc">Pointer knots pass through a resampling experiment, a sparse angular field, and four short offset echoes. A dense field thumbnail is crossed out as an abandoned direction. Gesture resampling alone is marked deeper.</desc>
