<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Partial temporal object process</title>
  <desc id="desc">A bundled still of a cup-like everyday object becomes sampled contour points, then five bounded ring-buffer slots, then three seeded time slices. A crossed-out camera branch points to the bundled still fallback. History selection alone is marked deeper.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24312b"/></marker></defs>
  <rect width="1080" height="420" fill="#eef4ef"/>
  <text x="36" y="44" font-family="sans-serif" font-size="22" font-weight="700" fill="#24312b">PARTIAL PROCESS C · TEMPORAL OBJECT</text>
  <g font-family="sans-serif" fill="#24312b">
    <rect x="36" y="80" width="210" height="250" rx="12" fill="#fdfffd" stroke="#24312b" stroke-width="2"/>
    <text x="54" y="110" font-size="16" font-weight="700">1 · BUNDLED STILL</text>
    <path d="M82 160h105l-12 118H96Z" fill="none" stroke="#24312b" stroke-width="8"/><path d="M187 181c50-3 50 67-7 62" fill="none" stroke="#24312b" stroke-width="8"/>
    <text x="54" y="310" font-size="12">original object silhouette</text>
    <rect x="276" y="80" width="205" height="250" rx="12" fill="#fdfffd" stroke="#24312b" stroke-width="2"/>
    <text x="294" y="110" font-size="16" font-weight="700">2 · CONTOUR POINTS</text>
    <g fill="#356e55"><circle cx="317" cy="162" r="5"/><circle cx="349" cy="162" r="5"/><circle cx="381" cy="162" r="5"/><circle cx="413" cy="162" r="5"/><circle cx="430" cy="190" r="5"/><circle cx="425" cy="230" r="5"/><circle cx="414" cy="276" r="5"/><circle cx="376" cy="276" r="5"/><circle cx="338" cy="276" r="5"/><circle cx="307" cy="250" r="5"/><circle cx="312" cy="205" r="5"/></g>
    <rect x="511" y="80" width="245" height="250" rx="12" fill="#fdfffd" stroke="#c4593d" stroke-width="4"/>
    <text x="529" y="110" font-size="16" font-weight="700">3 · BOUNDED HISTORY</text><text x="529" y="134" font-size="13">DEEPEN SELECTION ONLY</text>
    <g fill="none" stroke="#24312b" stroke-width="2"><rect x="535" y="163" width="34" height="108"/><rect x="577" y="163" width="34" height="108"/><rect x="619" y="163" width="34" height="108"/><rect x="661" y="163" width="34" height="108"/><rect x="703" y="163" width="34" height="108"/></g>
    <g fill="#356e55"><circle cx="552" cy="242" r="5"/><circle cx="594" cy="225" r="5"/><circle cx="636" cy="205" r="5"/><circle cx="678" cy="187" r="5"/><circle cx="720" cy="175" r="5"/></g>
    <text x="548" y="296" font-size="12">0</text><text x="590" y="296" font-size="12">1</text><text x="632" y="296" font-size="12">2</text><text x="674" y="296" font-size="12">3</text><text x="716" y="296" font-size="12">4</text>
    <rect x="786" y="80" width="258" height="250" rx="12" fill="#fdfffd" stroke="#24312b" stroke-width="2"/>
    <text x="804" y="110" font-size="16" font-weight="700">4 · SEEDED SLICES</text>
    <path d="M828 153h48l-6 120h-36Z" fill="none" stroke="#24312b" stroke-width="7"/><path d="M887 175h48l-6 98h-36Z" fill="none" stroke="#356e55" stroke-width="5"/><path d="M946 200h48l-6 73h-36Z" fill="none" stroke="#24312b" stroke-width="3"/>
    <text x="817" y="307" font-size="12">seed selects slots 4 · 2 · 0</text>
    <path d="M246 205H271M481 205H506M756 205H781" stroke="#24312b" stroke-width="3" marker-end="url(#a)"/>
    <rect x="55" y="347" width="170" height="43" fill="#fdfffd" stroke="#9da8a0" stroke-dasharray="5 4"/><text x="91" y="375" font-size="14">LIVE CAMERA</text>
    <path d="M48 340l184 57M232 340L48 397" stroke="#c4593d" stroke-width="5"/>
    <path d="M242 369H325" stroke="#24312b" stroke-width="3" marker-end="url(#a)"/><text x="342" y="375" font-size="14">replace with licensed bundled still + missing-file fallback</text>
  </g>
</svg>
