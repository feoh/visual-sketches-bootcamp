<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Partial typographic spring process</title>
  <desc id="desc">Three outlined glyph-like forms become anchor points connected by springs, then repeated offset frames. Spring response alone is marked deeper. Collision and audio branches are crossed out.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#292636"/></marker></defs>
  <rect width="1080" height="420" fill="#f2eef6"/>
  <text x="36" y="44" font-family="sans-serif" font-size="22" font-weight="700" fill="#292636">PARTIAL PROCESS B · TYPOGRAPHIC SPRING</text>
  <g font-family="sans-serif" fill="#292636">
    <rect x="36" y="80" width="220" height="260" rx="12" fill="#fffdfd" stroke="#292636" stroke-width="2"/>
    <text x="54" y="110" font-size="16" font-weight="700">1 · GLYPH OUTLINES</text>
    <path d="M62 282L98 142l36 140M78 222h40M151 142v140h55M220 142v140" fill="none" stroke="#292636" stroke-width="9" stroke-linejoin="round"/>
    <text x="54" y="317" font-size="12">licensed font · sampled contours</text>
    <rect x="291" y="80" width="240" height="260" rx="12" fill="#fffdfd" stroke="#b44b75" stroke-width="4"/>
    <text x="309" y="110" font-size="16" font-weight="700">2 · SPRING GRAPH</text><text x="309" y="134" font-size="13">DEEPEN THIS ONLY</text>
    <g stroke="#292636" stroke-width="3" fill="none"><path d="M326 242l42-76 47 88 76-91"/><path d="M326 242l89 12 76-91"/></g>
    <g fill="#b44b75" stroke="#292636" stroke-width="2"><circle cx="326" cy="242" r="10"/><circle cx="368" cy="166" r="10"/><circle cx="415" cy="254" r="10"/><circle cx="491" cy="163" r="10"/></g>
    <path d="M352 196l8-12 8 12 8-12 8 12" fill="none" stroke="#292636" stroke-width="2"/>
    <rect x="566" y="80" width="250" height="260" rx="12" fill="#fffdfd" stroke="#292636" stroke-width="2"/>
    <text x="584" y="110" font-size="16" font-weight="700">3 · OFFSET FRAMES</text>
    <g fill="none" stroke="#292636"><path d="M597 276L631 144l34 132M611 216h40M680 144v132h52" stroke-width="7"/><path d="M611 290L645 158l34 132M625 230h40M694 158v132h52" stroke-width="4"/><path d="M625 304L659 172l34 132M639 244h40M708 172v132h52" stroke-width="2"/></g>
    <path d="M256 208H286M531 208H561" stroke="#292636" stroke-width="3" marker-end="url(#a)"/>
    <rect x="850" y="87" width="190" height="96" rx="8" fill="#fffdfd" stroke="#9b95a5" stroke-dasharray="5 4"/><text x="869" y="120" font-size="15">COLLISION SYSTEM</text>
    <path d="M842 79l206 112M1048 79L842 191" stroke="#b44b75" stroke-width="5"/>
    <rect x="850" y="226" width="190" height="96" rx="8" fill="#fffdfd" stroke="#9b95a5" stroke-dasharray="5 4"/><text x="890" y="280" font-size="15">AUDIO INPUT</text>
    <path d="M842 218l206 112M1048 218L842 330" stroke="#b44b75" stroke-width="5"/>
    <text x="36" y="385" font-size="14">excluded branches keep type geometry and transforms as reuse, not second deepenings</text>
  </g>
</svg>
