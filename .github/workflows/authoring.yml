name: authoring

on:
  push:
    paths:
      - .github/workflows/authoring.yml
      - scripts/setup-linux.sh
      - tests/run-linux-setup-tests.sh
      - authoring/**
      - exercises/**
      - site/**
      - README.md
      - docs/publication.md
      - docs/curriculum-map.md
      - docs/implementation-roadmap.md
      - docs/pilot/**
      - docs/pilot-protocol-and-evidence.md
      - docs/review-process.md
      - docs/platform-matrix.md
      - docs/source-notes.md
      - LICENSE
      - LICENSES/**
      - THIRD_PARTY_NOTICES.md
      - scripts/build-site.*
      - scripts/check-authoring.*
      - scripts/setup-of.*
      - scripts/course-project.*
      - scripts/section-*.*
      - tests/run-authoring-check-tests.*
      - tests/run-section-*-tests.*
      - tests/run-first-cpp-test.*
  pull_request:
    paths:
      - .github/workflows/authoring.yml
      - scripts/setup-linux.sh
      - tests/run-linux-setup-tests.sh
      - authoring/**
      - exercises/**
      - site/**
      - README.md
      - docs/publication.md
      - docs/curriculum-map.md
      - docs/implementation-roadmap.md
      - docs/pilot/**
      - docs/pilot-protocol-and-evidence.md
      - docs/review-process.md
      - docs/platform-matrix.md
      - docs/source-notes.md
      - LICENSE
      - LICENSES/**
      - THIRD_PARTY_NOTICES.md
      - scripts/build-site.*
      - scripts/check-authoring.*
      - scripts/setup-of.*
      - scripts/course-project.*
      - scripts/section-*.*
      - tests/run-authoring-check-tests.*
      - tests/run-section-*-tests.*
      - tests/run-first-cpp-test.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  posix-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Report tools
        run: |
          hugo version
          shellcheck --version
      - name: Validate Linux distro setup selection and preparation contracts
        run: tests/run-linux-setup-tests.sh
      - name: Validate portable authoring contracts and Hugo fixtures
        run: tests/run-authoring-check-tests.sh
      - name: Test section 00 exercise and solution
        run: |
          if tests/run-section-00-tests.sh starter; then
            echo 'section 00 starter unexpectedly passed' >&2
            exit 1
          fi
          tests/run-section-00-tests.sh solution
      - name: Test section 01 exercise and solution
        run: |
          if tests/run-section-01-tests.sh starter; then
            echo 'section 01 starter unexpectedly passed' >&2
            exit 1
          fi
          tests/run-section-01-tests.sh solution
      - name: Test section 02 mark-family model
        run: tests/run-section-02-tests.sh
      - name: Test section 03 responsive-poster model
        run: tests/run-section-03-tests.sh
      - name: Test section 04 constellation model
        run: tests/run-section-04-tests.sh
      - name: Test section 05 phase-field model
        run: tests/run-section-05-tests.sh
      - name: Test section 06 controlled-chance model
        run: tests/run-section-06-tests.sh
      - name: Test section 07 local-coordinate model
        run: tests/run-section-07-tests.sh
      - name: Test section 08 gesture model
        run: tests/run-section-08-tests.sh
      - name: Test section 09 particle model
        run: tests/run-section-09-tests.sh
      - name: Test section 10 force model
        run: tests/run-section-10-tests.sh
      - name: Test section 11 flow-field model
        run: tests/run-section-11-tests.sh
      - name: Test section 12 color-trail model
        run: tests/run-section-12-tests.sh
      - name: Test section 13 temporal-history model
        run: tests/run-section-13-tests.sh
      - name: Test section 14 image-geometry model
        run: tests/run-section-14-tests.sh
      - name: Test section 15 audio-input model
        run: tests/run-section-15-tests.sh
      - name: Test section 16 structured-chance model
        run: tests/run-section-16-tests.sh
      - name: Test section 17 depth/light population model
        run: tests/run-section-17-tests.sh
      - name: Test starter and solution C++ known cases
        run: |
          tests/run-first-cpp-test.sh starter
          tests/run-first-cpp-test.sh solution
      - name: Lint POSIX authoring scripts
        run: shellcheck scripts/build-site.sh scripts/check-authoring.sh scripts/course-project.sh scripts/setup-linux.sh scripts/section-*.sh tests/run-authoring-check-tests.sh tests/run-linux-setup-tests.sh tests/run-section-*-tests.sh tests/run-first-cpp-test.sh

  windows-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
