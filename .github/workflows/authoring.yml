name: authoring

on:
  push:
    paths:
      - .github/workflows/authoring.yml
      - authoring/**
      - exercises/**
      - scripts/check-authoring.*
      - scripts/setup-of.*
      - scripts/course-project.*
      - scripts/section-00.*
      - scripts/section-01.*
      - scripts/section-02.*
      - tests/run-authoring-check-tests.*
      - tests/run-section-00-tests.*
      - tests/run-section-01-tests.*
      - tests/run-section-02-tests.*
      - tests/run-first-cpp-test.*
  pull_request:
    paths:
      - .github/workflows/authoring.yml
      - authoring/**
      - exercises/**
      - scripts/check-authoring.*
      - scripts/setup-of.*
      - scripts/course-project.*
      - scripts/section-00.*
      - scripts/section-01.*
      - scripts/section-02.*
      - tests/run-authoring-check-tests.*
      - tests/run-section-00-tests.*
      - tests/run-section-01-tests.*
      - tests/run-section-02-tests.*
      - tests/run-first-cpp-test.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Report tools
        run: |
          hugo version
          shellcheck --version
      - name: Validate portable authoring contracts and Hugo fixtures
        run: tests/run-authoring-check-tests.sh
      - name: Test section 00 geometry
        run: tests/run-section-00-tests.sh
      - name: Test section 01 motion model
        run: tests/run-section-01-tests.sh
      - name: Test section 02 mark-family model
        run: tests/run-section-02-tests.sh
      - name: Test starter and solution C++ known cases
        run: |
          tests/run-first-cpp-test.sh starter
          tests/run-first-cpp-test.sh solution
      - name: Lint POSIX authoring scripts
        run: shellcheck scripts/check-authoring.sh scripts/course-project.sh scripts/section-00.sh scripts/section-01.sh scripts/section-02.sh tests/run-authoring-check-tests.sh tests/run-section-00-tests.sh tests/run-section-01-tests.sh tests/run-section-02-tests.sh tests/run-first-cpp-test.sh

  windows-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Report tools
        shell: pwsh
        run: hugo version
      - name: Validate native PowerShell contract parity
        shell: pwsh
        run: tests/run-authoring-check-tests.ps1 -RequireHugo
      - name: Test section 00 geometry
        shell: pwsh
        run: tests/run-section-00-tests.ps1
      - name: Test section 01 motion model
        shell: pwsh
        run: tests/run-section-01-tests.ps1
      - name: Test section 02 mark-family model
        shell: pwsh
        run: tests/run-section-02-tests.ps1
      - name: Test starter and solution C++ known cases
        shell: pwsh
        run: |
          tests/run-first-cpp-test.ps1 -Variant starter
          tests/run-first-cpp-test.ps1 -Variant solution

  section-native:
    name: ${{ matrix.status }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - status: section-00-linux-build
            section: '00'
            os: ubuntu-24.04
            platform: linux64
            archive_sha: d6c1dcab777665b2aa63e5e3d9122cc116f096b3421db3493f795a621b399c63
          - status: section-00-macos-build
            section: '00'
            os: macos-15
            platform: osx
            archive_sha: e4a2dd6e75805320aac905f9f82f7b85e67a8b799137d47f35d40f7c4c195c9b
          - status: section-00-windows-build
            section: '00'
            os: windows-2022
            platform: vs
            archive_sha: 059f5210dd86beaee9dd17cfe4afe9eb5929376412b9baffda68ccd5d0b4d8a8
          - status: section-01-linux-build
            section: '01'
            os: ubuntu-24.04
            platform: linux64
            archive_sha: d6c1dcab777665b2aa63e5e3d9122cc116f096b3421db3493f795a621b399c63
          - status: section-01-macos-build
            section: '01'
            os: macos-15
            platform: osx
            archive_sha: e4a2dd6e75805320aac905f9f82f7b85e67a8b799137d47f35d40f7c4c195c9b
          - status: section-01-windows-build
            section: '01'
            os: windows-2022
            platform: vs
            archive_sha: 059f5210dd86beaee9dd17cfe4afe9eb5929376412b9baffda68ccd5d0b4d8a8
          - status: section-02-linux-build
            section: '02'
            os: ubuntu-24.04
            platform: linux64
            archive_sha: d6c1dcab777665b2aa63e5e3d9122cc116f096b3421db3493f795a621b399c63
          - status: section-02-macos-build
            section: '02'
            os: macos-15
            platform: osx
            archive_sha: e4a2dd6e75805320aac905f9f82f7b85e67a8b799137d47f35d40f7c4c195c9b
          - status: section-02-windows-build
            section: '02'
            os: windows-2022
            platform: vs
            archive_sha: 059f5210dd86beaee9dd17cfe4afe9eb5929376412b9baffda68ccd5d0b4d8a8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore checksum-addressed openFrameworks archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            openframeworks/*.tar.gz
            openframeworks/*.zip
          key: section-00-of-0.12.1-${{ matrix.platform }}-${{ matrix.archive_sha }}
      - name: Download, verify, and freshly extract openFrameworks (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/setup-of.sh --platform '${{ matrix.platform }}' --destination "$PWD/openframeworks" | tee /tmp/of-setup
          grep '^OF_ROOT=' /tmp/of-setup >> "$GITHUB_ENV"
      - name: Download, verify, and freshly extract openFrameworks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = .\scripts\setup-of.ps1 -Destination "$pwd\openframeworks"
          $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        shell: bash
        run: |
          for attempt in 1 2; do
            for _ in {1..24}; do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 5
            done
            if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
              echo "dpkg lock remained busy before attempt $attempt" >&2
              continue
            fi
            if printf 'y\n' | sudo timeout --kill-after=30s 10m "$OF_ROOT/scripts/linux/ubuntu/install_dependencies.sh" -y; then
              exit 0
            fi
            echo "dependency installation attempt $attempt failed; retrying" >&2
            sleep 10
          done
          exit 1
      - name: Report and enforce POSIX compatibility band
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          if [[ "$RUNNER_OS" == Linux ]]; then
            . /etc/os-release
            printf 'distribution=%s %s\n' "$NAME" "$VERSION_ID"
            [[ "$VERSION_ID" == 24.04 ]]
            [[ "$(uname -m)" == x86_64 ]]
            gcc --version
            g++ --version
            [[ "$(gcc -dumpfullversion -dumpversion | cut -d. -f1)" == 13 ]]
          else
            sw_vers
            [[ "$(sw_vers -productVersion)" == 15.* ]]
            [[ "$(uname -m)" == arm64 ]]
            xcodebuild -version
            xcodebuild -version | sed -n '1p' | grep -Eq '^Xcode 16([.]|$)'
            [[ "$(xcrun --show-sdk-version)" == 15.* ]]
            xcrun clang++ --version
          fi
      - name: Report and enforce Windows compatibility band
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          $nt = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          Write-Host "Windows build=$($nt.CurrentBuild).$($nt.UBR)"
          if ($nt.CurrentBuild -ne '20348') { throw 'Windows Server 2022 build 20348 is required' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json | Select-Object -First 1
          if (-not $vs -or $vs.installationVersion -notmatch '^17\.') { throw 'Visual Studio 2022 17.x with v143 is required' }
          Write-Host "Visual Studio=$($vs.installationVersion) path=$($vs.installationPath)"
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
          if (-not (Test-Path -LiteralPath $sdk -PathType Container)) { throw 'Windows SDK 10.0.26100.0 is required' }
          & (Join-Path $vs.installationPath 'MSBuild\Current\Bin\MSBuild.exe') -version
      - name: Generate starter and solution (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/section-${{ matrix.section }}.sh generate --project starter
          scripts/section-${{ matrix.section }}.sh generate --project solution
      - name: Build starter and solution in Debug and Release (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for project in starter solution; do
            scripts/section-${{ matrix.section }}.sh build --project "$project" --configuration Debug
            scripts/section-${{ matrix.section }}.sh build --project "$project" --configuration Release
          done
      - name: Generate starter and solution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\scripts\section-${{ matrix.section }}.ps1" generate -Project starter
          & ".\scripts\section-${{ matrix.section }}.ps1" generate -Project solution
      - name: Build starter and solution in Debug and Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($project in @('starter', 'solution')) {
            & ".\scripts\section-${{ matrix.section }}.ps1" build -Project $project -Configuration Debug
            & ".\scripts\section-${{ matrix.section }}.ps1" build -Project $project -Configuration Release
          }
      - name: Verify tracked inputs unchanged
        shell: bash
        run: git diff --exit-code -- . ':!.harness'
      - name: Upload section generation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.status }}-logs
          path: .harness/logs
          if-no-files-found: ignore
