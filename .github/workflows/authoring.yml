      - name: Test section 15 audio-input model
        shell: pwsh
        run: tests/run-section-15-tests.ps1
      - name: Test section 16 structured-chance model
        shell: pwsh
        run: tests/run-section-16-tests.ps1
      - name: Test section 17 depth/light population model
        shell: pwsh
        run: tests/run-section-17-tests.ps1
      - name: Test starter and solution C++ known cases
        shell: pwsh
        run: |
          tests/run-first-cpp-test.ps1 -Variant starter
          tests/run-first-cpp-test.ps1 -Variant solution

  section-native:
    name: ${{ matrix.status }}
    strategy:
      fail-fast: false
      # Reduce package-mirror pressure: prior unthrottled Linux jobs repeatedly
      # stalled in the upstream dependency installer until its timeout.
