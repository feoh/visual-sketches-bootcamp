    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore checksum-addressed openFrameworks archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            openframeworks/*.tar.gz
            openframeworks/*.zip
          key: section-00-of-0.12.1-${{ matrix.platform }}-${{ matrix.archive_sha }}
      - name: Download, verify, and freshly extract openFrameworks (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/setup-of.sh --platform '${{ matrix.platform }}' --destination "$PWD/openframeworks" | tee /tmp/of-setup
          grep '^OF_ROOT=' /tmp/of-setup >> "$GITHUB_ENV"
      - name: Download, verify, and freshly extract openFrameworks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = .\scripts\setup-of.ps1 -Destination "$pwd\openframeworks"
          $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 40
        shell: bash
        run: |
          for attempt in 1 2; do
            for _ in {1..24}; do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 5
            done
            if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
              echo "dpkg lock remained busy before attempt $attempt" >&2
              continue
            fi
            if (( attempt > 1 )); then
              echo "repairing package state after the interrupted dependency attempt" >&2
              sudo dpkg --configure -a || continue
              sudo apt-get --fix-broken install -y || continue
            fi
            if printf 'y\n' | sudo timeout --kill-after=1m 15m "$OF_ROOT/scripts/linux/ubuntu/install_dependencies.sh" -y; then
              exit 0
            fi
            echo "dependency installation attempt $attempt failed; retrying" >&2
            sleep 10
          done
          exit 1
      - name: Report and enforce POSIX compatibility band
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          if [[ "$RUNNER_OS" == Linux ]]; then
            . /etc/os-release
            printf 'distribution=%s %s\n' "$NAME" "$VERSION_ID"
            [[ "$VERSION_ID" == 24.04 ]]
            [[ "$(uname -m)" == x86_64 ]]
            gcc --version
            g++ --version
            [[ "$(gcc -dumpfullversion -dumpversion | cut -d. -f1)" == 13 ]]
          else
            sw_vers
            [[ "$(sw_vers -productVersion)" == 15.* ]]
            [[ "$(uname -m)" == arm64 ]]
            xcodebuild -version
            xcodebuild -version | sed -n '1p' | grep -Eq '^Xcode 16([.]|$)'
            [[ "$(xcrun --show-sdk-version)" == 15.* ]]
            xcrun clang++ --version
          fi
      - name: Report and enforce Windows compatibility band
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          $nt = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          Write-Host "Windows build=$($nt.CurrentBuild).$($nt.UBR)"
          if ($nt.CurrentBuild -ne '20348') { throw 'Windows Server 2022 build 20348 is required' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json | Select-Object -First 1
          if (-not $vs -or $vs.installationVersion -notmatch '^17\.') { throw 'Visual Studio 2022 17.x with v143 is required' }
          Write-Host "Visual Studio=$($vs.installationVersion) path=$($vs.installationPath)"
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
          if (-not (Test-Path -LiteralPath $sdk -PathType Container)) { throw 'Windows SDK 10.0.26100.0 is required' }
          & (Join-Path $vs.installationPath 'MSBuild\Current\Bin\MSBuild.exe') -version
      - name: Generate starter and solution (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/section-${{ matrix.section }}.sh generate --project starter
          scripts/section-${{ matrix.section }}.sh generate --project solution
      - name: Build starter and solution in Debug and Release (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for project in starter solution; do
            scripts/section-${{ matrix.section }}.sh build --project "$project" --configuration Debug
            scripts/section-${{ matrix.section }}.sh build --project "$project" --configuration Release
          done
      - name: Generate starter and solution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\scripts\section-${{ matrix.section }}.ps1" generate -Project starter
          & ".\scripts\section-${{ matrix.section }}.ps1" generate -Project solution
      - name: Build starter and solution in Debug and Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($project in @('starter', 'solution')) {
            & ".\scripts\section-${{ matrix.section }}.ps1" build -Project $project -Configuration Debug
            & ".\scripts\section-${{ matrix.section }}.ps1" build -Project $project -Configuration Release
          }
      - name: Verify tracked inputs unchanged
        shell: bash
        run: git diff --exit-code -- . ':!.harness'
      - name: Upload section generation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.status }}-logs
          path: .harness/logs
          if-no-files-found: ignore
