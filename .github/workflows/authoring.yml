name: authoring

on:
  push:
    paths:
      - .github/workflows/authoring.yml
      - authoring/**
      - scripts/check-authoring.*
      - tests/run-authoring-check-tests.*
  pull_request:
    paths:
      - .github/workflows/authoring.yml
      - authoring/**
      - scripts/check-authoring.*
      - tests/run-authoring-check-tests.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Report tools
        run: |
          hugo version
          shellcheck --version
      - name: Validate portable authoring contracts and Hugo fixtures
        run: tests/run-authoring-check-tests.sh
      - name: Lint POSIX authoring scripts
        run: shellcheck scripts/check-authoring.sh tests/run-authoring-check-tests.sh

  windows-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Report tools
        shell: pwsh
        run: hugo version
      - name: Validate native PowerShell contract parity
        shell: pwsh
        run: tests/run-authoring-check-tests.ps1 -RequireHugo
